name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: the `build` step is intentionally not run yet. The rollup build
# toolchain (rollup + @rollup/plugin-* + rollup-plugin-copy) is imported by
# js/rollup.dir.config.js but not declared in package.json devDependencies,
# so a clean clone cannot build. Add those devDependencies, then add a
# `npm run build` step here.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Lint
        run: npm run lint --if-present
